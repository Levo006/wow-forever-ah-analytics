      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/category_filters.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js && node --check static/static-api.js && node --check static/i18n.js
      - name: Item-Seiten-Code einspielen (keine Datenbankaenderung)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ahanalytics/itempages.py ahanalytics/export.py ahanalytics/db.py ahanalytics/__main__.py ahanalytics/sources/battlenet.py static/app.js static/i18n.js tests/test_itempages.py README.md
          git commit -m 'Echte Item-URLs: EN /item/<id>/ (Haupt, x-default) + DE /de/item/<id>/, 51k statische Seiten, Sitemap-Index; EN-Tooltips aus Battle.net (en-details, gedrosselt); Sprach-Default nach Browser'
          git rm .github/workflows/setup-itempages.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git push
      - name: Veroeffentlichung starten
        run: gh workflow run update.yml --ref main
