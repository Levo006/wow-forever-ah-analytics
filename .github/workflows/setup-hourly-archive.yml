      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Code-Backup vor Archiv-Ergaenzung
        run: git archive --format=tar.gz -o /tmp/before-hourly-archive.tar.gz HEAD .github ahanalytics tests
      - uses: actions/upload-artifact@v4
        with:
          name: before-hourly-archive
          path: /tmp/before-hourly-archive.tar.gz
