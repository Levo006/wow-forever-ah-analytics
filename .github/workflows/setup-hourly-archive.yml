      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
      - name: Archiv einrichten (keine Produktionsaenderung)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/archive_hourly.py tests/test_archive_hourly.py .github/workflows/archive-hourly.yml
          git commit -m 'Separates begrenztes Stundenarchiv fuer Erholungs-Backtest'
          git rm .github/workflows/setup-hourly-archive.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git push
      - name: Erste Sicherung mit altem Stundenstand starten
        run: gh workflow run archive-hourly.yml --ref main -f recover_backup=true
