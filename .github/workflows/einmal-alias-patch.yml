      - name: Regressionstests
        run: python -m unittest discover -s tests -v
      - name: Committen und pushen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deutsche Suche: belegte Classic-Namensaliase für Items ohne DE-Namen"
          git push
      - name: Erste Aktualisierung starten (füllt Aliase in die Datenbank)
        run: gh workflow run update.yml
      - name: Ersten Lauf abwarten
        run: |
          set -euo pipefail
          sleep 30
          for i in $(seq 1 90); do
            id=$(gh run list --workflow update.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            st=$(gh run view "$id" --json status,conclusion --jq '"\(.status) \(.conclusion // "-")"')
            echo "Lauf $id: $st"
            case "$st" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Erster Aktualisierungslauf nicht erfolgreich: $st"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Zeitüberschreitung beim Warten auf den ersten Lauf"; exit 1
      - name: Zweite Aktualisierung starten (veröffentlicht Aliase)
        run: gh workflow run update.yml
      - name: Zweiten Lauf abwarten
        run: |
          set -euo pipefail
          sleep 30
          for i in $(seq 1 90); do
            id=$(gh run list --workflow update.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            st=$(gh run view "$id" --json status,conclusion --jq '"\(.status) \(.conclusion // "-")"')
            echo "Lauf $id: $st"
            case "$st" in
              "completed success") exit 0 ;;
              completed*) echo "::error::Zweiter Aktualisierungslauf nicht erfolgreich: $st"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::Zeitüberschreitung beim Warten auf den zweiten Lauf"; exit 1
