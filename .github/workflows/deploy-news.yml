      - name: Regressionstests
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_*.py'
          node tests/goblins.test.js
          node tests/i18n.test.js
          node tests/recipes_core.test.js
          for f in static/app.js static/i18n.js static/item-tooltip.js static/static-api.js static/recipes-core.js; do node --check "$f"; done
          git diff --check
      - name: Aenderung committen und pushen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ahanalytics static tests
          git commit -m "News-Bereich: kuratierte Gold-Guides + WoW-Forever-/Blue-News (stuendlich aktualisiert)"
          git push
      - name: Einmal-Deploy-Workflow entfernen
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/deploy-news.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
