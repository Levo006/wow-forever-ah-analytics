      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/category_filters.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node tests/watchlist.test.js
          node --check static/app.js && node --check static/static-api.js && node --check static/i18n.js
      - name: Check-up-Code einspielen
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ahanalytics static tests
          git commit -m 'Check-up fuer getrennte Regelsatz-Stunden'
          git rm .github/workflows/setup-qc24.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git pull --rebase origin main
          git push
      - name: Veroeffentlichung starten
        run: gh workflow run update.yml --ref main
