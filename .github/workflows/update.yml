# Stündliche Aktualisierung der Website (läuft kostenlos auf GitHub).
#
# 1. Datenbank aus dem Release "datenbank" laden (beim ersten Lauf: seed/ah.sqlite.gz)
# 2. Auktionen aller Häuser über die Battle.net API holen (+ Namen neuer Items)
# 3. Alte Stundenwerte zu Tageswerten verdichten
# 4. Website bauen und auf GitHub Pages veröffentlichen
# 5. Fehlende Item-Namen in kleinen Portionen über Wowhead ergänzen (gedrosselt, daher zuletzt)
# 6. Datenbank zurück ins Release legen
#
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   BLIZZARD_CLIENT_ID, BLIZZARD_CLIENT_SECRET

name: Daten aktualisieren

on:
  schedule:
    - cron: "7,37 * * * *"   # Reserve: GitHub lässt geplante Läufe oft ausfallen – der eigentliche
                              # Takt kommt vom Job "naechster-lauf" unten (startet sich selbst neu)
  workflow_dispatch:        # manuell: Actions → "Daten aktualisieren" → Run workflow

permissions:
  contents: write   # Datenbank im Release speichern
  pages: write
  id-token: write
  actions: write    # nächsten Lauf selbst starten

jobs:
  # Wartet ~55 Minuten und startet dann den nächsten Lauf. Läuft parallel zum Update.
  # Laufen mehrere Ketten (z. B. weil zusätzlich ein geplanter Lauf kam), macht nur
  # der jüngste Lauf weiter – so bleibt es bei einer Kette.
  naechster-lauf:
    name: "Wartet ~55 Min. und startet dann den nächsten Lauf (läuft absichtlich so lange)"
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Warten bis zum nächsten Stand
        run: sleep 3300
      - name: Nächsten Lauf starten
        run: |
          newest=$(gh run list --workflow update.yml --limit 20 --json databaseId,status,createdAt --jq '[.[] | select(.status != "completed")] | sort_by(.createdAt) | last | .databaseId')
          echo "Jüngster offener Lauf: $newest, dieser Lauf: ${{ github.run_id }}"
          if [ "$newest" != "${{ github.run_id }}" ]; then
            echo "Ein neuerer Lauf führt die Kette fort – nichts zu tun"
            exit 0
          fi
          # Starten und prüfen, ob der neue Lauf wirklich anläuft (GitHub meldet selten
          # "startup_failure" – dann bräche die Kette ab). Bis zu 4 Versuche.
          for attempt in 1 2 3 4; do
            before=$(gh run list --workflow update.yml --limit 1 --json databaseId --jq '.[0].databaseId')
            gh workflow run update.yml --ref ${{ github.ref_name }} || true
            sleep 45
            read -r id concl <<< "$(gh run list --workflow update.yml --limit 1 --json databaseId,conclusion --jq '.[0] | "\(.databaseId) \(.conclusion // "-")"')"
            if [ "$id" != "$before" ] && [ "$concl" != "startup_failure" ]; then
              echo "Nächster Lauf gestartet (Versuch $attempt, Lauf $id)"
              exit 0
            fi
            echo "Start nicht erfolgreich (Lauf $id, Ergebnis $concl) – neuer Versuch"
            sleep 60
          done
          echo "Nächsten Lauf nicht starten können – der Zeitplan springt als Reserve ein"
          exit 1

  update:
    name: "Daten holen und Seite veröffentlichen"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daten-aktualisieren
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Europe/Berlin
      GH_TOKEN: ${{ github.token }}
      BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
      BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Datenbank laden
        run: |
          mkdir -p data
          if gh release download datenbank --pattern ah.sqlite.gz --dir data; then
            echo "Datenbank aus Release geladen"
          else
            echo "Kein Release gefunden – starte mit seed/ah.sqlite.gz"
            cp seed/ah.sqlite.gz data/
          fi
          gunzip -f data/ah.sqlite.gz
          python run.py info

      # Rezepte ändern sich nur mit neuen Spielversionen: wöchentlich bzw. bei neuem Build neu laden,
      # sonst nur eine Anfrage. Fehler hier dürfen den Lauf nicht aufhalten (alter Bestand bleibt).
      - name: Rezepte prüfen (wöchentlich)
        continue-on-error: true
        timeout-minutes: 8
        run: python run.py recipes

      - name: Auktionen holen (Battle.net)
        id: collect
        run: python run.py collect

      - name: Verdichten
        run: python run.py compact --vacuum

      - name: Website bauen
        run: python run.py publish --no-push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Erst nach dem Veröffentlichen: der gedrosselte Wowhead-Abruf dauert einige
      # Minuten und soll die neuen Preise nicht aufhalten (Namen erscheinen beim nächsten Lauf).
      - name: Fehlende Item-Namen ergänzen (Wowhead, gedrosselt)
        continue-on-error: true
        timeout-minutes: 10
        run: python run.py metadata --limit 80

      - name: Datenbank sichern
        if: ${{ !cancelled() && steps.collect.outcome == 'success' }}
        run: |
          python -c "import sqlite3; c = sqlite3.connect('data/ah.sqlite'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          gzip -6 -c data/ah.sqlite > ah.sqlite.gz
          ls -la ah.sqlite.gz
          if ! gh release view datenbank > /dev/null 2>&1; then
            gh release create datenbank --title "Datenbank (automatisch)" --prerelease               --notes "Wird stündlich vom Workflow 'Daten aktualisieren' überschrieben. Nicht löschen."
          fi
          gh release upload datenbank ah.sqlite.gz --clobber
