      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/category_filters.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js && node --check static/static-api.js && node --check static/i18n.js
      - name: Regelsaetze-Code einspielen (keine Datenbankaenderung)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ahanalytics static tests README.md
          git commit -m 'Regelsaetze: Normal als Standard, getrennte Maerkte statt Mischpreise'
          git rm .github/workflows/setup-rulesets.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git push
      - name: Veroeffentlichung starten
        run: gh workflow run update.yml --ref main
