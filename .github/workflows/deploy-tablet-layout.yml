name: Einmal-Deploy Tablet-Layout
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup vor dem Umbau
        run: git archive --format=tar.gz -o /tmp/before-tablet-layout.tar.gz HEAD static tests
      - uses: actions/upload-artifact@v4
        with:
          name: before-tablet-layout
          path: /tmp/before-tablet-layout.tar.gz
      - name: Patch sicher anwenden
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'B64'
          H4sIAFJq+2oC/8VVy27bOhDd+ytmUyCpQ1l0E9uhgYvgbosWRVt0T4kjibVECiTlOBHcb+9QduJH2gDFxUU3lDxDzeOcM2OliwIYK3UAOf
          FBBp1PFHpdGoabvJKmxCT3HrJXnCNtFG6Az6Scq0WSpLfZDccZ8DSdXV+PGGOvxh6Nx+PX49/dAePT+dUcxvFxC2QICvpWKqVNyYJtBX/X
          bpZPhsyGYJudbTuCpLC1ojNAX1gTmNePKPg1OWsMAR3zrczpO8GSlGMTPxGFzTvP1trrrEbobRdqbVBM2w14W2sFa+kuGCPj6nK59zJbFB
          6D2Ke9a1BpedFow+61CpXg6Q1vN5fQQ0IlZ9L9kxi5hr50WrHc1l1jxHS5jc481Kd2PmF8uYXtiD2FlZtD2DSGlUbBUbZ5uku2z7UPF7Bp
          axlwH9cLXjiQXbCUdyjme+eDLh6Yx7oQaNRRPUWNlNPJVsSDHFKt0YTO4YDDMyGC3xBMA/olXeZpxOP8ciKds/e90p7qeRDGGlxut6Px32
          vvBdxn/R5yp/9T75O38CWvGkmK+ypJd8EL+CDdCmEMH+ValzQi1kArvUcDBjM0qA0Bgw6MzqsADVZuQCmBHws+4MagMyTy54s0aC3W5op0
          bHyAWmJHk6E0wnvbFo+oKbvsPChs4JvG+9a6kMDbyS+oWUz/GzM78H89CAMDJ2xR4S5EnOBFIfN0KKQfAWRWPRxWw34TLIiU5dHs7ycUnk
          t8oiJSviNuetgngs8jp4t4RPOZLlrrdeRFOKQG9Zq4HFbWNJ1fzWA8TW+vOP/TnQUJAaqhPxXdYEtW7bljaCUWQ/ajwUnfRNdOWDtBsX+J
          LAFljSQXhG/oVvRq0HWmPFcEaeUTNfRYyZr086yJz6jjzwuZlejzymhaoQYy1PBjPiOMLn8jllfnuB+N44KWGZ1t7N37CErrdI4nW5vHrR
          13bYW6rILgyfXN8om9rLb56nypR3hOgteaREXB4z8O9fSH0SnY7xV4EOARBSeMrO93bA16P7a+vPUTBapJopwHAAA=
          B64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/deploy.patch
          echo "f2d77ba4e30a909293b97eaab144441da57824e38284721434c57883d48fe69e  /tmp/deploy.patch" | sha256sum -c -
          git apply --check /tmp/deploy.patch
          git apply --stat /tmp/deploy.patch
          git apply /tmp/deploy.patch
      - name: Regressionstests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js
          node --check static/item-tooltip.js
          node --check static/static-api.js
          node --check static/i18n.js
      - name: Geprueften Stand speichern
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static tests
          git commit -m "Tablet-Band: Kopfzeile stapelt sich, Platzhalter-Preis in Reitern nicht mehr abgeschnitten"
          git rm .github/workflows/deploy-tablet-layout.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
