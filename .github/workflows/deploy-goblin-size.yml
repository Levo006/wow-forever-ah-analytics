      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup vor dem Umbau
        run: git archive --format=tar.gz -o /tmp/before-goblin-size.tar.gz HEAD static tests
      - uses: actions/upload-artifact@v4
        with:
          name: before-goblin-size
          path: /tmp/before-goblin-size.tar.gz
