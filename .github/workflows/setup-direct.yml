name: Einmal-Setup Direkte Item-Links
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Code-Backup vor Direkte Item-Links-Umstellung
        run: git archive --format=tar.gz -o /tmp/before-direct.tar.gz HEAD .github static tests ahanalytics README.md
      - uses: actions/upload-artifact@v4
        with:
          name: before-direct
          path: /tmp/before-direct.tar.gz
