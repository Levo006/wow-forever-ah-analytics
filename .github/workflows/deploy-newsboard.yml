name: Einmal-Deploy Newsboard
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup vor dem Umbau
        run: git archive --format=tar.gz -o /tmp/before-newsboard.tar.gz HEAD static tests
      - uses: actions/upload-artifact@v4
        with:
          name: before-newsboard
          path: /tmp/before-newsboard.tar.gz
      - name: Patch sicher anwenden
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'B64'
          
          B64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/deploy.patch
          echo "b200d90254f4bbb2ae64af8416a07ac0427533fbc7a2fe997d0df76e030efcc5  /tmp/deploy.patch" | sha256sum -c -
          git apply --check /tmp/deploy.patch
          git apply --stat /tmp/deploy.patch
          git apply /tmp/deploy.patch
      - name: Regressionstests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js
          node --check static/item-tooltip.js
          node --check static/static-api.js
          node --check static/i18n.js
      - name: Geprueften Stand speichern
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static tests
          git commit -m "Newsboard ueber der Suche mit Icons, Einzelnes-AH-Dropdown entfernt"
          git rm .github/workflows/deploy-newsboard.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
