name: Einmal-Deploy Desktop-Lesbarkeit
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup vor dem Umbau
        run: git archive --format=tar.gz -o /tmp/before-desktop-runde3.tar.gz HEAD static
      - uses: actions/upload-artifact@v4
        with:
          name: before-desktop-runde3
          path: /tmp/before-desktop-runde3.tar.gz
