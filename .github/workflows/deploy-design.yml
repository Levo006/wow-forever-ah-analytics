      - name: Tests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node --check static/app.js && node --check static/static-api.js
      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Design-Redesign: goldenes Nachtmarkt-Theme, Muenz-Preise, edle Karten, Hero mit Haendlerweisheit, Micro-Interactions"
          git rm .github/workflows/deploy-design.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Datenlauf anstossen
        run: gh workflow run update.yml --ref main
