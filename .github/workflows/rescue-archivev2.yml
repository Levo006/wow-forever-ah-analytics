name: Stundenarchiv-Rettung abschliessen
on: workflow_dispatch
permissions:
  contents: write
jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Originaldateien verlustfrei zusammensetzen und pruefen
        run: |
          set -euo pipefail
          mkdir rescue && cd rescue
          gh release download ah-rulesets-hourly-v2-2026-11 --pattern '*.part-*'
          for day in 17 18 19; do
            stem=ah-rulesets-v2-2026-11-$day.tar
            cat "$stem.part-aa" "$stem.part-ab" > "$stem"
          done
          cat > checksums <<'CHECKS'
          b5eb5e3a90cde70936143f9c488228ce244e95f1df537169edcd25811681910a  ah-rulesets-v2-2026-11-17.tar
          85d87107d432c7aee57d14117b7413d4519efb9714d904cdc165a2e4b561615c  ah-rulesets-v2-2026-11-18.tar
          586e3edcc61d2185299974979534c5db27d4b71eb43532e0bd9de7d75a540495  ah-rulesets-v2-2026-11-19.tar
          CHECKS
          sha256sum -c checksums
          for day in 17 18 19; do
            gh release upload ah-rulesets-hourly-v2-2026-11 ah-rulesets-v2-2026-11-$day.tar
          done
          for part in *.part-*; do
            gh release delete-asset ah-rulesets-hourly-v2-2026-11 "$part" --yes
          done
      - name: Einmalworkflow entfernen
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/rescue-archivev2.yml
          git commit -m 'Archiv-Rettungsworkflow nach Sicherung entfernen'
          git pull --rebase origin main
          git push
