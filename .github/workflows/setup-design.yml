          echo '0eddba701e939526e1511aabb62ecdac54c9b18234cb72d0adc64626cfae5d52  /tmp/domain.patch' | sha256sum -c -
          git apply --check /tmp/domain.patch
          git apply /tmp/domain.patch
      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/category_filters.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js && node --check static/static-api.js
      - name: Domain-Dateien einspielen (keine Datenbankaenderung)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/app.js static/app.css
          git commit -m 'Mobile: News einklappbar (mobil standardmaessig zu), Suche zuerst'
          git rm .github/workflows/setup-design.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git push
      - name: Veroeffentlichung starten
        run: gh workflow run update.yml --ref main
