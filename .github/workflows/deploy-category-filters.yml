name: Einmal-Deploy Kategorie-Filter
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
