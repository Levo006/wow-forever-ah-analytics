      - name: Regressionstests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node tests/catalog.test.js
          node tests/market_runs.test.js
          node tests/search_state.test.js
          node tests/category_filters.test.js
          node --check static/app.js
          node --check static/item-tooltip.js
          node --check static/static-api.js
          node --check static/i18n.js
      - name: Geprueften Stand speichern
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md ahanalytics static tests .github/workflows/test.yml
          git commit -m "Kategorie-Filter: Beruf, Qualitaet, Stufe, Gewinnspanne, nur gelistet (Server+statisch gespiegelt)"
          git rm .github/workflows/deploy-category-filters.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
