        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node --check static/app.js && node --check static/static-api.js
      - name: Committen und pushen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "UX-Rework: Uebersicht mit Im-Fokus-Listen (nur Handelswaren/BoE), Top-Movers- und Deals-Ansicht aufgeloest, ruhigere Navigation, Item-Seite verschlankt"
          git rm .github/workflows/deploy-ux.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Datenlauf anstossen
        run: gh workflow run update.yml --ref main
