name: Einmal-Deploy Ftab-Stack
on: workflow_dispatch
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Backup vor dem Umbau
        run: git archive --format=tar.gz -o /tmp/before-ftab-stack.tar.gz HEAD static tests
      - uses: actions/upload-artifact@v4
        with:
          name: before-ftab-stack
          path: /tmp/before-ftab-stack.tar.gz
      - name: Patch sicher anwenden
        run: |
          set -euo pipefail
          cat > /tmp/patch.b64 <<'B64'
          H4sIAJVd/2oC/5VS246bMBB95ytGkSoly5rgQHYTeIn2C1ZV1XeDB7AWjIUnCk3UfnuHXHbbrRSpEmDPmeGcuWlTVSBEbQjU0pMiUy41el
          NbgWPZKFtjVHoPxR1nYKzGEdZJmhRFEkVJsUo2KgYZx09pGggh7nIHYRje59/tQKykfHyGcDqkBEZIw8kprY2tBfUuk4kb8xtQ9ER9d8F+
          BgARHQbl4NSpURyMpibj5L5MLn6WD/BNFS2SeFFWZ1C3aMoG4TsOb3y1OOxt/Qi+t56gVbivCDQO8NoqOjaqJb6rvWesg69oJnOuihp92V
          hDhBYKNPDr+WnjxkUED8sgZMlr5N7yl0VYma2pCQQWC7Q3LINimELhlQ+PMD9GLxGs6nTrt9tyAU55zxKX7C5CsRQbGbsRLNdBYCynZq+C
          Z33YdaiNmv/ZjjX/sACWhHln7BVmKkZPQQhRRaqAUz0YLQg7x7WjKPt231mfyWrI//aoAZXPZnYGM8evnuVDfxC1ctnqY0yZZANkeh7STS
          KqeE6EIwnV8iZkLVaUV70l4c0Rs1X8KVr/G32e+DtZ1Bnvp6VwgykRTh9ckovLWx6waNDUDWUySte5Np5r+JEVbV++5bwW3DXhnSqnjOPP
          5K3xNJFPk+Md+E/28wL+BtyXHiCEAwAA
          B64
          base64 -d /tmp/patch.b64 | gzip -d > /tmp/deploy.patch
          echo "033fed6326556a6d326ca524cd830d8100572d5758cd606e8e9abe0ddfd51a14  /tmp/deploy.patch" | sha256sum -c -
          git apply --check /tmp/deploy.patch
          git apply --stat /tmp/deploy.patch
          git apply /tmp/deploy.patch
      - name: Regressionstests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node --check static/app.js
          node --check static/item-tooltip.js
          node --check static/static-api.js
          node --check static/i18n.js
      - name: Geprueften Stand speichern
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static tests
          git commit -m "Tablet 701-1050px: Fraktions-Reiter gestapelt, breite Preise laufen nicht mehr ueber"
          git rm .github/workflows/deploy-ftab-stack.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
