          git apply --check /tmp/chartgap.patch
          git apply /tmp/chartgap.patch
      - name: Regressionstests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node tests/category_filters.test.js
          node tests/i18n.test.js
          node tests/goblins.test.js
          node tests/watchlist.test.js
          node tests/focus.test.js
          node --check static/app.js && node --check static/static-api.js && node --check static/i18n.js
      - name: Einspielen
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static
          git commit -m 'Preisverlauf: Tages- und 6-h-Mittel nicht mehr als Luecke trennen'
          git rm .github/workflows/setup-chartgap26.yml
          git commit -m 'Einmal-Setup-Workflow entfernt'
          git pull --rebase origin main
          git push
      - name: Veroeffentlichung starten
        run: gh workflow run update.yml --ref main
