      - name: Regressionstests
        run: |
          python -m unittest discover -s tests
          node tests/recipes_core.test.js
          node --check static/app.js
          node --check static/item-tooltip.js
          node --check static/static-api.js
      - name: Geprueften Stand speichern
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static ahanalytics/export.py tests/test_frontend_assets.py
          git commit -m "Arcane Exchange: modernes Fantasy-Design, Original-Tooltips, SVG-Muenzen und mobile Item-Karten"
          git rm .github/workflows/deploy-exchange.yml
          git commit -m "Einmal-Deploy-Workflow entfernt"
          git push
      - name: Seite neu veroeffentlichen
        run: gh workflow run update.yml --ref main
